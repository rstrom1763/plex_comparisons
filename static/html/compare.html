<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compare Servers</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <nav>
        <a href="/movies/gallery">← Back to Gallery</a>
        <a href="/duplicates">Duplicates</a>
        <a href="/add-server">Manage Servers</a>
    </nav>
    <h1>Server Comparison</h1>
    <div class="main-container">
        <div class="gallery-container">
            <div class="content-block comparison-header">
                <div class="control-group">
                    <label for="server-selector">Select Remote Server:</label>
                    <select id="server-selector">
                        <option value="">-- Choose a Server --</option>
                    </select>
                    <button id="compare-btn" class="btn btn-primary">Compare</button>
                </div>

                <div id="sort-controls" class="control-group" style="display: none;">
                    <!-- Sort controls moved to filter sidebar -->
                </div>
            </div>

            <div id="comparison-view" style="display: none;">
                <h2 id="comparing-with-title">Comparing with...</h2>
                <div class="gallery-info">
                    <span id="item-count">0</span> items found
                </div>
                <div class="content-block">
                    <h3>Available on Remote Server</h3>
                    <div id="remote-only-list" class="gallery">
                        <!-- Remote only movies -->
                    </div>
                </div>
            </div>
        </div>
        <aside class="filter-sidebar collapsed">
            <div id="filter-container">
                <!-- Filter Panel will be rendered here -->
                <p>Loading filters...</p>
            </div>
        </aside>
    </div>

    <script src="/static/js/compare.js" type="module"></script>
</body>
</html>
