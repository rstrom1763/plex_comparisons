<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compare Servers</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <nav>
        <a href="/movies/gallery">← Back to Gallery</a>
        <a href="/add-server">Manage Servers</a>
    </nav>
    <h1>Server Comparison</h1>

    <div class="content-block comparison-header">
        <div class="control-group">
            <label for="server-selector">Select Remote Server:</label>
            <select id="server-selector">
                <option value="">-- Choose a Server --</option>
            </select>
            <button id="compare-btn" class="btn btn-primary">Compare</button>
        </div>

        <div id="sort-controls" class="control-group" style="display: none;">
            <label for="sort-property">Sort By:</label>
            <select id="sort-property">
                <option value="title">Title</option>
                <option value="year">Year</option>
                <option value="critic_rating">Critic Rating</option>
                <option value="audience_rating">Audience Rating</option>
                <option value="size">Size</option>
                <option value="duration">Duration</option>
            </select>
            <label for="sort-direction">Order:</label>
            <select id="sort-direction">
                <option value="asc">Ascending</option>
                <option value="desc">Descending</option>
            </select>
        </div>
    </div>

    <div id="comparison-view" style="display: none;">
        <h2 id="comparing-with-title">Comparing with...</h2>
        <div class="content-block">
            <h3>Available on Remote Server</h3>
            <div id="remote-only-list" class="gallery">
                <!-- Remote only movies -->
            </div>
        </div>
    </div>

    <script src="/static/js/compare.js" type="module"></script>
</body>
</html>
