<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Servers</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <nav id="main-nav"></nav>
    <h1>Manage Remote Servers</h1>

    <div class="content-block">
        <h3 id="form-title">Add Server</h3>
        <form id="add-server-form" style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
            <input type="hidden" id="server-id">
            <input type="text" id="server-name" placeholder="Server Name" required>
            <input type="text" id="server-address" placeholder="https://192.168.1.100:8080" required>
            <input type="password" id="server-token" placeholder="Shared Token" required>
            <button type="submit" id="submit-btn" class="btn btn-primary">Add Server</button>
            <button type="button" id="cancel-edit" class="btn btn-danger" style="display: none;">Cancel</button>
        </form>

        <h3 style="margin-top: 40px;">Registered Servers</h3>
        <ul id="server-list" class="server-list">
            <!-- Servers will be listed here -->
        </ul>
    </div>

    <script src="/static/js/navbar.js" type="module"></script>
    <script src="/static/js/add_server.js" type="module"></script>
</body>
</html>
