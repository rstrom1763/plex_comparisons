<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Gallery</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <nav>
        <a href="/compare">Compare Servers</a>
        <a href="/duplicates">Duplicates</a>
        <a href="/add-server">Manage Servers</a>
        <a href="/trusted-servers">Trusted Servers</a>
        <a href="#" onclick="logout(); return false;" style="margin-left: 10px;">Logout</a>
    </nav>
    <h1>Movie Gallery</h1>
    <div class="main-container">
        <div class="gallery-container">
            <div id="gallery-info" class="gallery-info">
                <span id="item-count">0</span> items found
            </div>
            <div id="movie-gallery" class="gallery">
                <p style="grid-column: 1/-1; text-align: center;">Loading movies...</p>
            </div>
        </div>
        <aside class="filter-sidebar collapsed">
            <div id="filter-container">
                <!-- Filter Panel will be rendered here -->
                <p>Loading filters...</p>
            </div>
        </aside>
    </div>

    <script src="/static/js/gallery.js" type="module"></script>
    <script type="module">
        import { getCookie, authenticatedFetch, handleFetchError } from '/static/js/utils.js';

        async function logout() {
            const resp = await authenticatedFetch('/logout', { method: 'POST' });
            if (resp.ok) {
                window.location.href = '/login';
            } else {
                await handleFetchError(resp, 'logout');
            }
        }
        window.logout = logout;
    </script>
</body>
</html>
