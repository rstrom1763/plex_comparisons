name: Build and Upload

on:
  push:
    branches: [ main, dev ]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Uses the Go version from go.mod
          go-version-file: go.mod

      - name: Build binary
        run: go build -o plex_compare .

      - name: Strip binary
        run: strip ./plex_compare

      - name: Prepare dist folder
        run: |
          mkdir -p dist
          cp plex_compare dist/plex_compare-linux-amd64

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: plex_compare-linux-amd64
          path: dist/plex_compare-linux-amd64

      # Single auto-maintained "latest" release
      - name: Create / update 'latest' GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest plex_compare build
          make_latest: "true"
          files: |
            dist/plex_compare-linux-amd64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}