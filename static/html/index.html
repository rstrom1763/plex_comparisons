<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Gallery</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <nav id="main-nav"></nav>
    <h1>Movie Gallery</h1>
    <div class="main-container">
        <div class="gallery-container">
            <div id="gallery-info" class="gallery-info">
                <span id="item-count">0</span> items found
            </div>
            <div id="movie-gallery" class="gallery">
                <div class="spinner-container">
                    <div class="spinner"></div>
                    <p class="loading-text">Loading movies...</p>
                </div>
            </div>
        </div>
        <aside class="filter-sidebar collapsed">
            <div id="filter-container">
                <!-- Filter Panel will be rendered here -->
                <p>Loading filters...</p>
            </div>
        </aside>
    </div>

    <script src="/static/js/gallery.js" type="module"></script>
    <script src="/static/js/navbar.js" type="module"></script>
</body>
</html>
